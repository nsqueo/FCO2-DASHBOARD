
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RED TAG - FAULTY EKS | FCO2</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header { text-align: center; padding: 30px 20px 10px; }
        .header h1 { font-size: 2.2em; color: #fff; margin-bottom: 5px; }
        .header .subtitle { color: #a8b2d1; font-size: 1em; }
        #clock { font-size: 1.2em; color: #4ecca3; margin-top: 8px; }
        #lastUpdate { font-size: 0.85em; color: #666; margin-top: 5px; }
        .dashboard {
            flex: 1; display: flex; flex-wrap: wrap;
            justify-content: center; align-items: center;
            padding: 40px 20px; gap: 25px;
        }
        .card {
            background: linear-gradient(135deg, #16213e 0%, #0f3460 100%);
            border-radius: 20px; padding: 40px 50px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
            border: 1px solid rgba(233,69,96,0.3);
            text-align: center; max-width: 900px; width: 100%;
        }
        .card h2 {
            font-size: 1.5em; text-transform: uppercase;
            letter-spacing: 3px; margin-bottom: 30px; color: #e94560;
        }
        .numbers-container { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; }
        .number-box {
            background: rgba(233,69,96,0.12); border: 2px solid #e94560;
            border-radius: 12px; padding: 20px 30px; font-size: 3.5em;
            font-weight: bold; color: #fff; min-width: 110px;
        }
        .status { text-align: center; padding: 20px; color: #a8b2d1; font-size: 1em; }
        .status.error { color: #e94560; }
        .status.loading { color: #4ecca3; }
        .footer { text-align: center; padding: 15px; color: #444; font-size: 0.75em; }
        .live-dot {
            display: inline-block; width: 10px; height: 10px;
            background: #4ecca3; border-radius: 50%; margin-right: 6px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<div class="header">
    <h1>&#x1F6AB; RED TAG - FAULTY EKS</h1>
    <div class="subtitle">FCO2 - Pick Department</div>
    <div id="clock"></div>
    <div id="lastUpdate"><span class="live-dot"></span>In attesa del primo caricamento...</div>
</div>

<div class="dashboard" id="dashboard">
    <div class="status loading">&#x23F3; Caricamento dati...</div>
</div>

<div class="footer">I dati si aggiornano automaticamente ogni 30 secondi da Google Sheets</div>

<script>
var CONFIG_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRDHdThnZM2oeclHydf2h2KQhl2vbs0qwD6BBSnUzsxFbDFE-PDEj3s0sosuAWU6Tr03lk3k-xel4wy/pub?gid=0&single=true&output=csv";
var REFRESH_MS = 30000;
var NL = String.fromCharCode(10);
var dashboard = document.getElementById("dashboard");

function loadData() {
    fetch(CONFIG_URL)
        .then(function(r) {
            if (!r.ok) throw new Error("HTTP " + r.status);
            return r.text();
        })
        .then(function(csv) {
            var data = parseCSV(csv);
            renderDashboard(data);
            updateLastRefresh();
        })
        .catch(function(e) {
            console.error("Errore:", e);
            dashboard.innerHTML = '<div class="status error">Errore nel caricamento dati. Riprovo tra 30 secondi...</div>';
        });
}

function parseCSV(csv) {
    var lines = csv.trim().split(NL);
    var data = [];
    for (var i = 0; i < lines.length; i++) {
        var line = lines[i].trim();
        if (!line) continue;
        var titolo = "";
        var numeri = "";
        if (line.indexOf('"') !== -1) {
            var match = line.match(/^([^,]+),"(.+)"$/);
            if (match) {
                titolo = match[1].trim();
                numeri = match[2].trim();
            } else {
                var parts = line.replace(/"/g, "").split(",");
                titolo = parts[0].trim();
                numeri = parts.slice(1).join(",").trim();
            }
        } else {
            var parts2 = line.split(",");
            titolo = parts2[0].trim();
            numeri = parts2.slice(1).join(",").trim();
        }
        if (titolo && numeri) {
            data.push({ titolo: titolo, numeri: numeri });
        }
    }
    return data;
}

function renderDashboard(data) {
    if (!data || data.length === 0) {
        dashboard.innerHTML = '<div class="status error">Nessun dato trovato nel foglio</div>';
        return;
    }
    dashboard.innerHTML = "";
    for (var j = 0; j < data.length; j++) {
        var row = data[j];
        var numbers = row.numeri.split(",");
        var clean = [];
        for (var k = 0; k < numbers.length; k++) {
            var n = numbers[k].trim();
            if (n !== "") clean.push(n);
        }
        if (clean.length === 0) continue;
        var card = document.createElement("div");
        card.className = "card";
        var html = "";
        for (var m = 0; m < clean.length; m++) {
            html += '<div class="number-box">' + clean[m] + '</div>';
        }
        card.innerHTML = '<h2>' + row.titolo + '</h2><div class="numbers-container">' + html + '</div>';
        dashboard.appendChild(card);
    }
}

function updateLastRefresh() {
    var now = new Date();
    document.getElementById("lastUpdate").innerHTML = '<span class="live-dot"></span>Ultimo aggiornamento: ' + now.toLocaleTimeString("it-IT");
}

function updateClock() {
    var now = new Date();
    var options = { weekday: "long", day: "numeric", month: "long", hour: "2-digit", minute: "2-digit", second: "2-digit" };
    document.getElementById("clock").textContent = now.toLocaleDateString("it-IT", options);
}

setInterval(updateClock, 1000);
updateClock();
loadData();
setInterval(loadData, REFRESH_MS);
</script>

</body>
</html>
